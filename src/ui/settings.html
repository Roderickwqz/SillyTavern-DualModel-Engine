<section id="dualmodel-settings" class="dualmodel-panel" aria-label="DualModel Engine">
  <h3>DualModel Engine</h3>
  <fieldset data-scope="global"><legend>Global defaults</legend>
    <label><input data-dme-field="enabled" type="checkbox"> Enable DualModel Engine</label>
    <label>Recorder profile <select data-dme-field="recorderProfileId"></select></label>
    <label>Default rules <select data-dme-field="rulePresetId"></select></label>
    <label>Adjudication <select data-dme-field="adjudication"><option value="automatic-tool">Automatic tool</option><option value="enforced-preflight">Enforced preflight</option><option value="confirm">Confirm</option><option value="manual">Manual</option></select></label>
    <label>Injection budget <input data-dme-field="injectionBudget" type="number" min="256" max="8192" step="64"></label>
    <label>Update policy <select data-dme-field="updatePolicy"><option value="after-each-reply">After each reply</option><option value="manual">Manual</option></select></label>
    <label><input data-dme-field="showStatusBar" type="checkbox"> Show status bar</label>
  </fieldset>
  <fieldset data-scope="character" data-dme-role="character-settings"><legend>Current character defaults</legend>
    <label><input data-dme-field="enabled" type="checkbox"> Enable DualModel Engine</label>
    <label>Recorder profile <select data-dme-field="recorderProfileId"></select></label>
    <label>Default rules <select data-dme-field="rulePresetId"></select></label>
    <label>Adjudication <select data-dme-field="adjudication"><option value="automatic-tool">Automatic tool</option><option value="enforced-preflight">Enforced preflight</option><option value="confirm">Confirm</option><option value="manual">Manual</option></select></label>
    <label>Injection budget <input data-dme-field="injectionBudget" type="number" min="256" max="8192" step="64"></label>
  </fieldset>
  <fieldset data-scope="chat" data-dme-role="chat-settings"><legend>Current chat</legend>
    <label><input data-dme-field="enabled" type="checkbox"> Enable DualModel Engine</label>
    <label>Recorder profile <select data-dme-field="recorderProfileId"></select></label>
    <label>Rules <select data-dme-field="rulePresetId"></select></label>
    <label>Adjudication <select data-dme-field="adjudication"><option value="automatic-tool">Automatic tool</option><option value="enforced-preflight">Enforced preflight</option><option value="confirm">Confirm</option><option value="manual">Manual</option></select></label>
    <label>Injection budget <input data-dme-field="injectionBudget" type="number" min="256" max="8192" step="64"></label>
    <output data-dme-role="chat-disabled-reason" aria-live="polite"></output>
  </fieldset>
  <output data-dme-role="task-status" aria-live="polite"></output>
  <div role="tablist" aria-label="DualModel chat tools">
    <button type="button" role="tab" aria-controls="dme-state" aria-selected="true" data-dme-tab="state">State</button><button type="button" role="tab" aria-controls="dme-checks" aria-selected="false" data-dme-tab="checks">Checks</button><button type="button" role="tab" aria-controls="dme-history" aria-selected="false" data-dme-tab="history">History</button><button type="button" role="tab" aria-controls="dme-rules" aria-selected="false" data-dme-tab="rules">Rules</button><button type="button" role="tab" aria-controls="dme-diagnostics" aria-selected="false" data-dme-tab="diagnostics">Diagnostics</button>
  </div>
  <aside data-dme-role="status-bar" aria-live="polite"></aside>
  <section id="dme-state" role="tabpanel"><textarea data-dme-role="state-json"></textarea><pre data-dme-role="patch-preview"></pre><button type="button" data-dme-action="edit-state">Edit state</button><button type="button" data-dme-action="save-state">Save state</button></section>
  <section id="dme-checks" role="tabpanel" hidden><div data-dme-role="checks-list"></div><button type="button" data-dme-action="reroll">Reroll</button><button type="button" data-dme-action="apply-damage">Apply damage</button></section>
  <section id="dme-history" role="tabpanel" hidden><div data-dme-role="history-list"></div><button type="button" data-dme-action="recalculate">Recalculate</button><button type="button" data-dme-action="resummarize">Resummarize</button></section>
  <section id="dme-rules" role="tabpanel" hidden><div data-dme-role="rules-list"></div><button type="button" data-dme-action="import-preset">Import</button><button type="button" data-dme-action="export-preset">Export</button></section>
  <section id="dme-diagnostics" role="tabpanel" hidden><pre data-dme-role="diagnostics-json"></pre><button type="button" data-dme-action="export-raw">Export raw data</button></section>
  <button type="button" data-dme-action="probe-tools">Probe tool calling</button>
  <pre data-dme-role="diagnostic-reasons"></pre>
</section>
